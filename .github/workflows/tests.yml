name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        include:  # oldest versions: the newest Ubuntu runner no longer ships them
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: macos-latest, python: "3.9" }
          - { os: windows-latest, python: "3.9" }
          - { os: macos-latest, python: "3.8" }
          - { os: windows-latest, python: "3.8" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q tests
